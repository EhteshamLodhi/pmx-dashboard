name: Reminder Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: reminder-cron
  cancel-in-progress: false

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Validate scheduler secrets
        run: |
          if [ -z "${{ secrets.REMINDER_BASE_URL }}" ]; then
            echo "Missing GitHub secret: REMINDER_BASE_URL"
            exit 1
          fi
          if [ -z "${{ secrets.REMINDER_CRON_SECRET }}" ]; then
            echo "Missing GitHub secret: REMINDER_CRON_SECRET"
            exit 1
          fi

      - name: Trigger reminder endpoint
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.REMINDER_CRON_SECRET }}" \
            "${{ secrets.REMINDER_BASE_URL }}/api/notifications/reminders"
